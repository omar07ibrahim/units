name: Stage ONNX evidence

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: stage-onnx-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"

jobs:
  stage:
    if: >-
      github.actor == 'omar07ibrahim' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up the pinned renderer runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/evidence/package-lock.json

      - name: Install exact evidence dependencies
        run: |
          python -m pip install --editable '.[dev]'
          npm --prefix tools/evidence ci --ignore-scripts
          python -m pip check

      - name: Generate and independently replay ONNX evidence
        run: |
          PYTHONPATH=src python -B -m tools.evidence.onnx_evidence --record
          npm --prefix tools/evidence run render
          PYTHONPATH=src python -B -m tools.evidence.generate --write-manifest
          PYTHONPATH=src python -B -m tools.evidence.onnx_evidence --check
          npm --prefix tools/evidence run check
          PYTHONPATH=src python -B -m tools.evidence.generate --check

      - name: Commit only the generated evidence
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -- \
            docs/assets/onnx-* \
            docs/evidence/captures/onnx-* \
            docs/evidence/contracts/onnx-speed.graph.json \
            docs/evidence/manifest.json \
            docs/evidence/models/speed-contract.onnx \
            docs/evidence/onnx-demo \
            docs/evidence/onnx-provenance.json
          git diff --cached --check
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='Omar Ibrahim' \
            -c user.email='31526072+omar07ibrahim@users.noreply.github.com' \
            commit -m 'Generate reproducible ONNX evidence'
          git push origin "HEAD:refs/heads/${HEAD_REF}"
