<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title description">
  <title id="title">UnitSentinel hosted distribution verification</title>
  <desc id="description">The complete stable nine-line capture reconstructed by the hosted CPython 3.12.3 Linux x86-64 distribution job: environment probes, the isolated verifier command, exact success output, and exit zero.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fa5bd"/>
    </marker>
  </defs>
  <rect width="1440" height="520" fill="url(#background)"/>
<rect x="32" y="28" width="1376" height="464" rx="20" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="32" y="28" width="1376" height="66" rx="20" fill="#12233a"/>
<rect x="32" y="74" width="1376" height="20" fill="#12233a"/>
<circle cx="70" cy="61" r="8" fill="#ff6b7a"/>
<circle cx="98" cy="61" r="8" fill="#ffc857"/>
<circle cx="126" cy="61" r="8" fill="#5ee6a8"/>
<text x="720" y="68" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle">hosted distribution contract · exact stable capture</text>
<rect x="32" y="92" width="1376" height="4" fill="#5ee6a8"/>
<text x="62" y="126" data-source-line="1" xml:space="preserve" fill="#38d9f5" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400">$ python -c &#x27;import platform; print(platform.python_version())&#x27;</text>
<text x="62" y="164" data-source-line="2" xml:space="preserve" fill="#d8e4f2" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400">3.12.3</text>
<text x="62" y="202" data-source-line="3" xml:space="preserve" fill="#38d9f5" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400">$ uname -s</text>
<text x="62" y="240" data-source-line="4" xml:space="preserve" fill="#d8e4f2" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400">Linux</text>
<text x="62" y="278" data-source-line="5" xml:space="preserve" fill="#38d9f5" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400">$ uname -m</text>
<text x="62" y="316" data-source-line="6" xml:space="preserve" fill="#d8e4f2" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400">x86_64</text>
<text x="62" y="354" data-source-line="7" xml:space="preserve" fill="#38d9f5" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400">$ python -I tools/verify_distribution.py --wheelhouse &quot;$RUNNER_TEMP/unitsentinel-wheelhouse&quot;</text>
<text x="62" y="392" data-source-line="8" xml:space="preserve" fill="#5ee6a8" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700">verified unitsentinel 0.1.0: canonical sdist -&gt; py3-none-any wheel -&gt; offline Z3 install</text>
<text x="62" y="430" data-source-line="9" xml:space="preserve" fill="#5ee6a8" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700">[exit 0]</text>
</svg>
