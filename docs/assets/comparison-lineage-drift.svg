<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title description">
  <title id="title">UnitSentinel normalization lineage comparison</title>
  <desc id="description">Real compatible and drift claims showing full content-lineage, semantic-lineage, and output-normalization SHA-256 digests. Content identity differs in both cases; semantic and output normalization match only for the compatible case. The whole-lineage semantic digest is reviewer evidence, not a comparison-decision input.</desc>
