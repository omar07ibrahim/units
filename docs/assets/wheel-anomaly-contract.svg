<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Verified wheel anomaly contract flow</title>
  <desc id="description">A real six-operation ML feature pipeline with exact dimensions, unit scales, acceleration derivation, normalization, and sigmoid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fa5bd"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#background)"/>
<text x="60" y="64" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start">Physics-informed wheel anomaly feature</text>
<text x="60" y="98" fill="#8fa5bd" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Dimensions, scales, and kinds come from the live verified record.</text>
<rect x="55" y="160" width="275" height="155" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="55" y="160" width="7" height="155" rx="3.5" fill="#38d9f5"/>
<text x="83" y="198" fill="#38d9f5" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">wheel-speed-kph</text>
<text x="83" y="230" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="83" dy="0">length^1 time^-1</tspan>
      <tspan x="83" dy="25">scale 5/18 · linear</tspan>
    </text>
<rect x="55" y="365" width="275" height="155" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="55" y="365" width="7" height="155" rx="3.5" fill="#38d9f5"/>
<text x="83" y="403" fill="#38d9f5" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">previous speed</text>
<text x="83" y="435" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="83" dy="0">length^1 time^-1</tspan>
      <tspan x="83" dy="25">scale 5/18 · linear</tspan>
    </text>
<rect x="410" y="260" width="255" height="160" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="410" y="260" width="7" height="160" rx="3.5" fill="#b69cff"/>
<text x="438" y="298" fill="#b69cff" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">SUBTRACT</text>
<text x="438" y="330" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="438" dy="0">speed-delta-kph</tspan>
      <tspan x="438" dy="25">length^1 time^-1</tspan>
      <tspan x="438" dy="25">scale 5/18 · linear</tspan>
    </text>
<rect x="745" y="260" width="255" height="160" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="745" y="260" width="7" height="160" rx="3.5" fill="#b69cff"/>
<text x="773" y="298" fill="#b69cff" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">CONVERT → m/s</text>
<text x="773" y="330" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="773" dy="0">speed-delta-si</tspan>
      <tspan x="773" dy="25">length^1 time^-1</tspan>
      <tspan x="773" dy="25">scale 1 · linear</tspan>
    </text>
<rect x="55" y="640" width="275" height="155" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="55" y="640" width="7" height="155" rx="3.5" fill="#38d9f5"/>
<text x="83" y="678" fill="#38d9f5" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">sample-period-ms</text>
<text x="83" y="710" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="83" dy="0">time^1</tspan>
      <tspan x="83" dy="25">scale 1/1000 · linear</tspan>
    </text>
<rect x="410" y="640" width="255" height="155" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="410" y="640" width="7" height="155" rx="3.5" fill="#b69cff"/>
<text x="438" y="678" fill="#b69cff" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">CONVERT → s</text>
<text x="438" y="710" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="438" dy="0">sample-period-si</tspan>
      <tspan x="438" dy="25">time^1</tspan>
      <tspan x="438" dy="25">scale 1 · linear</tspan>
    </text>
<rect x="1080" y="380" width="285" height="175" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="1080" y="380" width="7" height="175" rx="3.5" fill="#5ee6a8"/>
<text x="1108" y="418" fill="#5ee6a8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">DIVIDE Δv / Δt</text>
<text x="1108" y="450" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="1108" dy="0">acceleration-si</tspan>
      <tspan x="1108" dy="25">length^1 time^-2</tspan>
      <tspan x="1108" dy="25">scale 1 · linear</tspan>
    </text>
<rect x="745" y="680" width="255" height="155" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="745" y="680" width="7" height="155" rx="3.5" fill="#38d9f5"/>
<text x="773" y="718" fill="#38d9f5" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">reference accel.</text>
<text x="773" y="750" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="773" dy="0">length^1 time^-2</tspan>
      <tspan x="773" dy="25">scale 1 · linear</tspan>
    </text>
<rect x="1080" y="625" width="285" height="220" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="1080" y="625" width="7" height="220" rx="3.5" fill="#5ee6a8"/>
<text x="1108" y="663" fill="#5ee6a8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">DIVIDE + SIGMOID</text>
<text x="1108" y="695" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="1108" dy="0">normalized-acceleration</tspan>
      <tspan x="1108" dy="25">dimensionless</tspan>
      <tspan x="1108" dy="25">scale 1 · linear</tspan>
      <tspan x="1108" dy="25">anomaly-score</tspan>
      <tspan x="1108" dy="25">dimensionless</tspan>
      <tspan x="1108" dy="25">scale 1 · linear</tspan>
    </text>
<path d="M330,237 L410,320" stroke="#8fa5bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M330,442 L410,365" stroke="#8fa5bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M665,340 L745,340" stroke="#8fa5bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="705.0" y="330.0" fill="#8fa5bd" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">5/18 → 1</text>
<path d="M1000,340 L1080,445" stroke="#8fa5bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M330,717 L410,717" stroke="#8fa5bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M665,717 L1080,500" stroke="#8fa5bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="872.5" y="598.5" fill="#8fa5bd" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">time^1</text>
<path d="M1220,555 L1220,625" stroke="#8fa5bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1000,757 L1080,757" stroke="#8fa5bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
