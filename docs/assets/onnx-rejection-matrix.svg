<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">ONNX fail-closed rejection matrix</title>
  <desc id="description">Actual stable CLI failures for: dynamic-shape, runtime-pow-tensor, embedded-initializer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fa5bd"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#background)"/>
<text x="55" y="65" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start">Unsupported ONNX semantics fail closed</text>
<text x="55" y="103" fill="#8fa5bd" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">These diagnostics were captured from actual CLI invocations.</text>
<rect x="45" y="205" width="430" height="455" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="45" y="205" width="7" height="455" rx="3.5" fill="#ffc857"/>
<text x="73" y="243" fill="#ffc857" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">dynamic-shape</text>
<text x="73" y="275" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="73" dy="0">exit 4</tspan>
      <tspan x="73" dy="25">598 source bytes</tspan>
      <tspan x="73" dy="25">72cc31c6bf45c91f…</tspan>
      <tspan x="73" dy="25"></tspan>
      <tspan x="73" dy="25">unitsentinel: error: ONNX model input</tspan>
      <tspan x="73" dy="25">is invalid: ONNX tensor dimensions</tspan>
      <tspan x="73" dy="25">must be static</tspan>
    </text>
<rect x="505" y="205" width="430" height="455" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="505" y="205" width="7" height="455" rx="3.5" fill="#ff6b7a"/>
<text x="533" y="243" fill="#ff6b7a" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">runtime-pow-tensor</text>
<text x="533" y="275" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="533" dy="0">exit 4</tspan>
      <tspan x="533" dy="25">593 source bytes</tspan>
      <tspan x="533" dy="25">f57850c453574f85…</tspan>
      <tspan x="533" dy="25"></tspan>
      <tspan x="533" dy="25">unitsentinel: error: ONNX model input</tspan>
      <tspan x="533" dy="25">is invalid: ONNX operator is not in</tspan>
      <tspan x="533" dy="25">the reviewed subset</tspan>
    </text>
<rect x="965" y="205" width="430" height="455" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="965" y="205" width="7" height="455" rx="3.5" fill="#b69cff"/>
<text x="993" y="243" fill="#b69cff" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">embedded-initializer</text>
<text x="993" y="275" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="993" dy="0">exit 4</tspan>
      <tspan x="993" dy="25">622 source bytes</tspan>
      <tspan x="993" dy="25">e4549c9c713cfd2f…</tspan>
      <tspan x="993" dy="25"></tspan>
      <tspan x="993" dy="25">unitsentinel: error: ONNX model input</tspan>
      <tspan x="993" dy="25">is invalid: ONNX initializers and</tspan>
      <tspan x="993" dy="25">external tensor data are not supported</tspan>
    </text>
<rect x="180" y="740" width="1080" height="105" rx="18" fill="#0d1b2d" stroke="#253a55" stroke-width="2" filter="url(#shadow)"/>
<rect x="180" y="740" width="7" height="105" rx="3.5" fill="#5ee6a8"/>
<text x="208" y="778" fill="#5ee6a8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">RECORDED BOUNDARY RESULT</text>
<text x="208" y="810" fill="#d8e4f2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">
      <tspan x="208" dy="0">3 CLI cases · 0 graphs published</tspan>
    </text>
</svg>
