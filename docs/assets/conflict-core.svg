<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title description">
  <title id="title">UnitSentinel conflict-core explanation</title>
  <desc id="description">The actual four-witness deletion-minimal conflict produced by the wheel anomaly serving-contract error.</desc>
  <defs>
