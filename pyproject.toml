[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unitsentinel"
version = "0.1.0"
description = "Dimensional proof certificates for scientific and ML computation graphs"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Omar Ibrahim", email = "31526072+omar07ibrahim@users.noreply.github.com" },
]
dependencies = [
    "z3-solver==4.16.0.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/omar07ibrahim/units"
Issues = "https://github.com/omar07ibrahim/units/issues"
Documentation = "https://github.com/omar07ibrahim/units#readme"

[project.scripts]
unitsentinel = "unitsentinel.cli:main"

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "coverage[toml]==7.15.2",
    "mypy==2.3.0",
    "onnx==1.22.0",
    "pip-audit==2.10.1",
    "ruff==0.16.0",
    "setuptools==83.0.0",
]
onnx = [
    "onnx==1.22.0",
]

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitsentinel = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src",
    "tools/evidence",
    "tools/measure_comparison_result_boundary.py",
    "tools/verify_distribution.py",
]

[tool.coverage.run]
branch = true
source = ["unitsentinel"]

[tool.coverage.report]
fail_under = 95
show_missing = true
